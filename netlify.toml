# Lucet docs site (the Konfabulator).
# This repo has its own Netlify project. Confirm the target project before
# deploying; the CLI uses whatever .netlify link is in the working directory.

[build]
  command = "npm run build"
  publish = "apps/docs/dist"

[build.environment]
  NODE_VERSION = "24"

# This site is meant to be found. No noindex header, no robots exclusion.

# Pretty paths resolve; everything unknown gets the site's own 404
# (public/404.html — Netlify serves it automatically once no catch-all
# swallows misses). The old /* -> /index.html 200 made every typo
# silently render the Konfabulator and made a real 404 impossible.
[[redirects]]
  from = "/components"
  to = "/components.html"
  status = 301

[[redirects]]
  from = "/primitives"
  to = "/primitives.html"
  status = 301
