name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Build first. The docs app imports the workspace packages by their
      # published names, so their .d.ts files have to exist before anything can
      # typecheck. A clean checkout has no dist, which is why this passed
      # locally and failed on the first CI run.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The accessibility audit drives a real browser on purpose: three of the
      # four contrast failures found by hand were cascade or paint behaviour
      # that token maths alone cannot see.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: WCAG 2.2 AA audit
        run: node scripts/audit-a11y.mjs

      # Dark is declared twice throughout the stylesheets, once under
      # prefers-color-scheme and once under [data-theme], because CSS cannot
      # share a declaration body across the two. Those copies drift: the
      # contact shadow that gives Expressive its thickness once lived only in
      # the media-query copy, so the toggle path rendered flat. Neither the
      # contrast audit nor the eye can see that -- the paths are identical in
      # colour and never render side by side.
      - name: Theme parity audit
        run: node scripts/audit-theme-parity.mjs
      - name: State audit
        run: node scripts/audit-states.mjs
      - name: Expression geometry audit
        run: node scripts/audit-expression-geometry.mjs

      # The two audits above check what states LOOK like. This one drives a
      # real pointer and checks that states ARRIVE: dead hovers, disabled
      # controls that still react, and hit areas that sit over the wrong
      # element all computed to perfectly legal colours.
      - name: State transition audit
        run: node scripts/audit-states.mjs
