name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The accessibility audit drives a real browser on purpose: three of the
      # four contrast failures found by hand were cascade or paint behaviour
      # that token maths alone cannot see.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: WCAG 2.2 AA audit
        run: node scripts/audit-a11y.mjs
