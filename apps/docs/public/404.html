      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;

      }
      main { text-align: center; padding: 24px; }
      p { margin: 0 0 12px; }
      a { color: inherit; text-underline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: oklch(0.152 0.008 264); color: oklch(0.95 0.008 264); }
