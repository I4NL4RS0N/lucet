<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    The Lucet tile, carrying Ian Larson's personal mark — a stand-in by
    choice while the Lucet glyph itself is still being explored (three
    rounds so far: orb-and-arc, woven cord-L, script cord-L; the search
    continues in the scratch matrices and the notes).

    What IS settled is the material: the graphite plate with its diagonal
    gradient, the top sheen, the hairline edge-light, and a whisper of halo
    behind the glyph — a made object, not a line drawing, dark in both
    themes the way a lamp stays a lamp in daylight.
  -->
  <defs>
    <linearGradient id="lm-plate" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#34343f"/>
      <stop offset="0.52" stop-color="#191920"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="lm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.17"/>
      <stop offset="0.38" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lm-halo">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lm-clip"><rect width="96" height="96" rx="27"/></clipPath>
  </defs>
  <rect width="96" height="96" rx="27" fill="url(#lm-plate)"/>
  <g clip-path="url(#lm-clip)">
    <circle cx="48" cy="48" r="30" fill="url(#lm-halo)"/>
    <path transform="translate(-2.58 1.11) scale(0.14427)" fill="#F4F5FB" d="M425.57,429.21c-3.97,0-6.35-4.42-4.16-7.73l127.91-193.94c2.18-3.31-.19-7.73-4.16-7.73h-81.27c-3.35,0-6.48,1.69-8.32,4.48l-132.19,200.44c-1.84,2.79-4.97,4.48-8.32,4.48h-68.91c-3.97,0-6.35-4.42-4.16-7.73l173.94-263.75c2.18-3.31-.19-7.73-4.16-7.73h-76.28c-3.35,0-6.48,1.69-8.32,4.48l-176.75,268c-2.18,3.31.19,7.73,4.16,7.73h71.19c3.97,0,6.35,4.42,4.16,7.73l-35.83,54.34c-2.18,3.31.19,7.73,4.16,7.73h81.27c3.35,0,6.48-1.68,8.32-4.48l40.13-60.84c1.84-2.8,4.97-4.48,8.32-4.48h68.91c3.97,0,6.35,4.42,4.16,7.73l-35.83,54.34c-2.18,3.31.19,7.73,4.16,7.73h126.12c3.35,0,6.48-1.68,8.32-4.48l38.64-58.59c2.18-3.31-.19-7.73-4.16-7.73h-121.03Z"/>
    <rect width="96" height="96" rx="27" fill="url(#lm-sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="95" height="95" rx="26.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
</svg>
