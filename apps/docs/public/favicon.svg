<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    The Lucet mark, round three: one orb, one sweep of light.

    Lucet means "it shines", and light needs dark to shine: a glowing core
    and a single dasharray arc - the ActivityOrb's own drawing technique -
    on a graphite tile with a diagonal gradient, a top sheen, and a hairline
    edge. A made object, not a line drawing.

    Two earlier rounds carried a second, fainter arc leaving the tile ("the
    light continues past what you can see"). It read as intended at 96px
    and as debris at 16 - a favicon-first mark cannot keep an element that
    only survives at poster size, so the idea retired and the whole
    composition recentred and firmed up: bigger core, wider halo, stronger
    plate. The tile stays dark in both themes, the way a lamp stays a lamp
    in daylight.
  -->
  <defs>
    <linearGradient id="lm-plate" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#34343f"/>
      <stop offset="0.52" stop-color="#191920"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="lm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.17"/>
      <stop offset="0.38" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lm-halo">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lm-core">
      <stop offset="0.6" stop-color="#fff"/>
      <stop offset="1" stop-color="#DDE0EC"/>
    </radialGradient>
    <clipPath id="lm-clip"><rect width="96" height="96" rx="27"/></clipPath>
  </defs>
  <rect width="96" height="96" rx="27" fill="url(#lm-plate)"/>
  <g clip-path="url(#lm-clip)">
    <circle cx="48" cy="49" r="26" fill="url(#lm-halo)"/>
    <g fill="none" stroke-linecap="round">
      <circle cx="48" cy="49" r="24" stroke="#F4F5FB" stroke-width="7" stroke-dasharray="102 49" transform="rotate(114 48 49)"/>
    </g>
    <circle cx="48" cy="49" r="9" fill="url(#lm-core)"/>
    <rect width="96" height="96" rx="27" fill="url(#lm-sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="95" height="95" rx="26.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
</svg>
