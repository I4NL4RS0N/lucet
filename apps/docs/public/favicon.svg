<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    The Lucet mark: an orb of light larger than its frame.

    Lucet means "it shines". The library's signature geometry is the activity
    orb - rings of light, arc fragments, a core - so the mark is that orb,
    CROPPED: the arcs sweep through the frame and leave it on three sides,
    because the light continues past what you can see. Drawn with the orb's
    own technique (dasharray fragments on circles), not illustrated.

    Two rings only, so it survives 16px. The gaps face upper-left; the light
    reads as turning, not broadcasting.
  -->
  <style>
    .s { stroke: #1a1a1f; } .f { fill: #1a1a1f; }
    @media (prefers-color-scheme: dark) {
      .s { stroke: #ededf0; } .f { fill: #ededf0; }
    }
  </style>
  <g fill="none" stroke-linecap="round" class="s">
    <circle cx="46" cy="50" r="23" stroke-width="6" stroke-dasharray="95 50" transform="rotate(105 46 50)"/>
    <circle cx="46" cy="50" r="52" stroke-width="5" stroke-dasharray="120 65 55 87" transform="rotate(-40 46 50)"/>
  </g>
  <circle cx="46" cy="50" r="7" class="f"/>
</svg>
