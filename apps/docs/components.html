<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lucet · Components</title>
    <script>
      // Before first paint: the STORED appearance wins (one choice carries
      // across all three pages); the lab's own fallback stays monochrome so
      // primitives are judged without accent seduction.
      try { var a = JSON.parse(localStorage.getItem('lucet-docs-appearance') || '{}') } catch (e) { a = {} }
      document.documentElement.setAttribute('data-theme', a.theme || 'dark')
      document.documentElement.setAttribute('data-accent', a.accent || 'monochrome')
      document.documentElement.setAttribute('data-neutral', a.neutral || 'accent')
      if (a.expression === 'expressive') document.documentElement.setAttribute('data-expression', a.expression)
      if (a.radius && a.radius !== 'default') document.documentElement.setAttribute('data-radius', a.radius)
      document.documentElement.setAttribute('data-scale', a.scale || '100')
      document.documentElement.setAttribute('data-typeface', a.typeface || 'inter')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/components-stage/main.tsx"></script>
  </body>
</html>
