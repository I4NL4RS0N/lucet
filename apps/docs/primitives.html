<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lucet · Primitives</title>
    <script>
      // Before first paint, not in a React effect. The page mounted with no
      // data-theme for a frame, then the effect landed and every control
      // cross-faded from the OS-preference values to the page's own -- a
      // visible smear on every load, because transitions were already armed.
      document.documentElement.setAttribute('data-theme', 'dark')
      document.documentElement.setAttribute('data-accent', 'monochrome')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/primitives/main.tsx"></script>
  </body>
</html>
