<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Open-source AI interface components for the states real AI features actually hit — refusals, interruptions, rate limits, stale answers — with a written rationale for every one."
    />
    <meta property="og:title" content="Lucet" />
    <meta
      property="og:description"
      content="AI interface patterns for what comes next: the missing states designed, the missing features working."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#111013" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the default, so it loads eagerly to avoid a flash on first
         paint. Tagged so the lazy loader recognises it and does not duplicate
         it. Every other typeface is injected on demand. -->
    <link
      data-typeface="inter"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      data-display-face="instrument-sans"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lucet</title>
    <script src="/appearance-boot.js" data-accent="violet"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
