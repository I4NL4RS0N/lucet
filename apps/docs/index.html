<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the default, so it loads eagerly to avoid a flash on first
         paint. Tagged so the lazy loader recognises it and does not duplicate
         it. Every other typeface is injected on demand. -->
    <link
      data-typeface="inter"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Lucet</title>
    <script>
      // Before first paint: the STORED appearance wins; dark/violet is only
      // the site's resting fallback. One choice, three pages, no flash.
      try { var a = JSON.parse(localStorage.getItem('lucet-docs-appearance') || '{}') } catch (e) { a = {} }
      document.documentElement.setAttribute('data-theme', a.theme || 'dark')
      document.documentElement.setAttribute('data-accent', a.accent || 'violet')
      document.documentElement.setAttribute('data-neutral', a.neutral || 'subtle')
      if (a.expression === 'expressive') document.documentElement.setAttribute('data-expression', a.expression)
      if (a.radius && a.radius !== 'default') document.documentElement.setAttribute('data-radius', a.radius)
      document.documentElement.setAttribute('data-scale', a.scale || '100')
      document.documentElement.setAttribute('data-typeface', a.typeface || 'inter')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
